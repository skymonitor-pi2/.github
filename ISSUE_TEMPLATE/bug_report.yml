name: Bug Report
description: Report a software defect in the Edge Node, Central AI Server, Mission Control HUD, or Shared Core.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Affected Module
      description: Which part of SkyMonitor is experiencing the issue?
      options:
        - Edge Node (edge/)
        - Central AI Server (server/)
        - Mission Control Frontend (frontend/)
        - Shared Schemas & Projection (shared/)
        - Training Pipeline (training/)
        - Documentation (docs/)
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Execution Mode
      options:
        - Live Hardware (Raspberry Pi 4 + PC Server)
        - Simulation Mode (EDGE_SIMULATION_MODE=true)
        - Local Dev / Tests Only
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise summary of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Commands, API calls, or UI actions required to reproduce the behavior.
      placeholder: |
        1. Start Edge Node with ...
        2. Start Central Server with ...
        3. Open Mission Control at ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Traceback
      description: Paste relevant terminal output or browser console errors (remove any sensitive credentials).
      render: shell
