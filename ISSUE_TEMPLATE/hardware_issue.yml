name: Hardware & Sensor Issue
description: Report a wiring, calibration, driver, or RF acquisition issue on the Raspberry Pi 4 Edge Node.
title: "[Hardware]: "
labels: ["hardware", "edge"]
body:
  - type: dropdown
    id: subsystem
    attributes:
      label: Hardware Subsystem
      options:
        - All-Sky Fisheye Camera (CSI OV5647)
        - PTZ Tracking Camera (USB)
        - GPS Module (u-blox NEO-6M UART)
        - IMU Sensor (MPU-6050 I2C)
        - ADS-B Receiver (RTL-SDR 1090 MHz)
        - Pan / Tilt Gimbal Actuators
        - Power / Mechanical Enclosure
    validations:
      required: true

  - type: textarea
    id: symptoms
    attributes:
      label: Observed Behavior
      description: Describe the hardware fault, telemetry drift, or driver error.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic Output
      description: Include relevant output from i2cdetect, lsusb, libcamera-hello, or edge service logs.
      render: shell
